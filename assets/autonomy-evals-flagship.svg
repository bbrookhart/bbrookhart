<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Preserving Human Agency — foundation model autonomy evaluation</title>
  <desc id="desc">Autonomy Evals studies evidence-sensitive agreement, counterevidence recovery, value-sensitive deliberation, and action pressure across epistemic, value, and action autonomy. Thirty authored base scenarios expand into 720 controlled variants; a v0.2 validity upgrade adds positive controls and measurement validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.58" stop-color="#081827"/>
      <stop offset="1" stop-color="#11142b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8ddcf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#203552" stroke-width="2"/>
  <rect x="52" y="34" width="1096" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="73" fill="#7dd3fc" font-size="14" font-weight="750" letter-spacing="2.4">ACTIVE AI SAFETY RESEARCH // MEASUREMENT DEVELOPMENT</text>
    <text x="56" y="113" fill="#f2fbff" font-size="30" font-weight="800">PRESERVING HUMAN AGENCY</text>
    <text x="56" y="141" fill="#91a8bf" font-size="16" letter-spacing="0.5">Foundation-model evaluation for epistemic, value, and action autonomy</text>

    <g filter="url(#shadow)" transform="translate(56 176)">
      <rect width="246" height="105" rx="13" fill="#0d1c30" stroke="#24415f"/>
      <text x="18" y="42" fill="#38bdf8" font-size="31" font-weight="800">30</text>
      <text x="18" y="67" fill="#e5edf6" font-size="15" font-weight="650">authored base scenarios</text>
      <text x="18" y="89" fill="#7892ad" font-size="12">v0.1 controlled study catalog</text>
    </g>

    <g filter="url(#shadow)" transform="translate(318 176)">
      <rect width="246" height="105" rx="13" fill="#0d2227" stroke="#246052"/>
      <text x="18" y="42" fill="#2dd4bf" font-size="31" font-weight="800">720</text>
      <text x="18" y="67" fill="#e9fbf6" font-size="15" font-weight="650">controlled variants</text>
      <text x="18" y="89" fill="#7ea99e" font-size="12">paired conditions · multi-turn</text>
    </g>

    <g filter="url(#shadow)" transform="translate(580 176)">
      <rect width="246" height="105" rx="13" fill="#17182e" stroke="#51428d"/>
      <text x="18" y="42" fill="#a78bfa" font-size="31" font-weight="800">3</text>
      <text x="18" y="67" fill="#f2efff" font-size="15" font-weight="650">autonomy domains</text>
      <text x="18" y="89" fill="#aaa1ca" font-size="12">epistemic · value · action</text>
    </g>

    <g transform="translate(852 170)">
      <rect width="296" height="117" rx="14" fill="#0b1725" stroke="#2e5369"/>
      <text x="20" y="28" fill="#8fa6bf" font-size="11" font-weight="750" letter-spacing="1.8">CORE VALIDITY TEST</text>
      <text x="20" y="57" fill="#e8f8ff" font-size="16" font-weight="750">Evidence-sensitive agreement</text>
      <text x="20" y="81" fill="#8ea7ba" font-size="12">retain warranted agreement</text>
      <text x="20" y="100" fill="#8ea7ba" font-size="12">reduce unsupported user-following</text>
    </g>

    <path d="M178 309 H1022" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.65"/>
    <circle cx="178" cy="309" r="4" fill="#38bdf8"/>
    <circle cx="459" cy="309" r="4" fill="#2dd4bf"/>
    <circle cx="740" cy="309" r="4" fill="#7dd3fc"/>
    <circle cx="1022" cy="309" r="4" fill="#a78bfa"/>

    <text x="178" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">USER POSITION</text>
    <text x="459" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">MODEL RESPONSE</text>
    <text x="740" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">COUNTEREVIDENCE</text>
    <text x="1022" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">MEASUREMENT</text>

    <text x="600" y="370" text-anchor="middle" fill="#d8e7f2" font-size="12" font-weight="700" letter-spacing="1.7">MEASURE MODEL BEHAVIOR · VALIDATE THE MEASUREMENT · KEEP THE CLAIM BOUNDED</text>
  </g>
</svg>
