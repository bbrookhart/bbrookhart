<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Faultline — continuous adversarial validation across AI and cloud</title>
  <desc id="desc">Faultline traces cross-layer attack paths from AI input through agent tools, identity, cloud infrastructure, and critical assets, then verifies whether defensive changes break those paths. Synthetic lab evidence includes AI-agent, MCP, and coding-agent baseline-to-hardened comparisons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.58" stop-color="#091827"/>
      <stop offset="1" stop-color="#15132a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8ddcf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#203552" stroke-width="2"/>
  <rect x="52" y="34" width="1096" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="73" fill="#fbbf24" font-size="14" font-weight="750" letter-spacing="2.4">PRIVATE IMPLEMENTATION // ADVERSARIAL VALIDATION RESEARCH</text>
    <text x="56" y="113" fill="#f2fbff" font-size="30" font-weight="800">FAULTLINE</text>
    <text x="56" y="141" fill="#91a8bf" font-size="16" letter-spacing="0.5">Find the path. Prove the risk. Break the chain.</text>

    <g filter="url(#shadow)" transform="translate(56 176)">
      <rect width="246" height="105" rx="13" fill="#0d1c30" stroke="#24415f"/>
      <text x="18" y="40" fill="#38bdf8" font-size="26" font-weight="800">236/720 → 0</text>
      <text x="18" y="67" fill="#e5edf6" font-size="15" font-weight="650">AI-agent attack trials</text>
      <text x="18" y="89" fill="#7892ad" font-size="12">synthetic lab · baseline → hardened</text>
    </g>

    <g filter="url(#shadow)" transform="translate(318 176)">
      <rect width="246" height="105" rx="13" fill="#211a10" stroke="#6b4d1d"/>
      <text x="18" y="40" fill="#fbbf24" font-size="26" font-weight="800">371/600 → 0</text>
      <text x="18" y="67" fill="#fff7e6" font-size="15" font-weight="650">MCP attack trials</text>
      <text x="18" y="89" fill="#bca276" font-size="12">synthetic lab · provenance + trust</text>
    </g>

    <g filter="url(#shadow)" transform="translate(580 176)">
      <rect width="246" height="105" rx="13" fill="#17182e" stroke="#51428d"/>
      <text x="18" y="40" fill="#a78bfa" font-size="26" font-weight="800">381/630 → 0</text>
      <text x="18" y="67" fill="#f2efff" font-size="15" font-weight="650">coding-agent attack trials</text>
      <text x="18" y="89" fill="#aaa1ca" font-size="12">synthetic arena · utility preserved</text>
    </g>

    <g transform="translate(852 170)">
      <rect width="296" height="117" rx="14" fill="#0b1725" stroke="#2e5369"/>
      <text x="20" y="28" fill="#8fa6bf" font-size="11" font-weight="750" letter-spacing="1.8">RESEARCH QUESTION</text>
      <text x="20" y="55" fill="#e8f8ff" font-size="15" font-weight="750">Can weaknesses cross trust</text>
      <text x="20" y="76" fill="#e8f8ff" font-size="15" font-weight="750">boundaries into material impact?</text>
      <text x="20" y="100" fill="#8ea7ba" font-size="12">Then find the minimum control cut.</text>
    </g>

    <path d="M146 309 H1054" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.68"/>
    <circle cx="146" cy="309" r="4" fill="#38bdf8"/>
    <circle cx="373" cy="309" r="4" fill="#67e8f9"/>
    <circle cx="600" cy="309" r="4" fill="#f59e0b"/>
    <circle cx="827" cy="309" r="4" fill="#c084fc"/>
    <circle cx="1054" cy="309" r="4" fill="#a78bfa"/>

    <text x="146" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">AI INPUT</text>
    <text x="373" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">AGENT + TOOL</text>
    <text x="600" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">IDENTITY</text>
    <text x="827" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">CLOUD</text>
    <text x="1054" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">CONSEQUENCE</text>

    <text x="600" y="370" text-anchor="middle" fill="#d8e7f2" font-size="12" font-weight="700" letter-spacing="1.6">MEASURE THE PATH · VERIFY THE FIX · PRESERVE LEGITIMATE WORK</text>
  </g>
</svg>
