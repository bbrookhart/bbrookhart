<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">FAULTLINE — AI and Cloud Adversarial Validation Platform</title>
  <desc id="desc">Dark technical banner with red-orange fault-line and attack-path graph motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090F"/>
      <stop offset="0.55" stop-color="#111318"/>
      <stop offset="1" stop-color="#17130F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="0.48" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3F3F46" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="418" rx="27" fill="none" stroke="#2B2A28" stroke-width="2"/>

  <g opacity="0.68" stroke="#78716C" stroke-width="2">
    <path d="M975 110L1075 170L1162 118L1264 185" fill="none"/>
    <path d="M1075 170L1050 278L1168 316L1264 185" fill="none"/>
    <path d="M1162 118L1168 316" fill="none"/>
  </g>
  <g fill="#0F1014" stroke-width="3">
    <circle cx="975" cy="110" r="15" stroke="#EF4444"/>
    <circle cx="1075" cy="170" r="15" stroke="#F97316"/>
    <circle cx="1162" cy="118" r="15" stroke="#FB923C"/>
    <circle cx="1264" cy="185" r="15" stroke="#F59E0B"/>
    <circle cx="1050" cy="278" r="15" stroke="#EF4444"/>
    <circle cx="1168" cy="316" r="15" stroke="#F97316"/>
  </g>

  <g filter="url(#glow)">
    <path d="M1002 74l38 58-22 46 43 55-31 55 47 57" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <rect x="82" y="68" width="126" height="28" rx="14" fill="#7F1D1D" opacity="0.22" stroke="#EF4444"/>
  <text x="145" y="87" text-anchor="middle" fill="#FCA5A5" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="1.8">PRIVATE BUILD</text>

  <text x="82" y="175" fill="#FAFAF9" font-size="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing="5">FAULTLINE</text>
  <rect x="82" y="197" width="620" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="82" y="246" fill="#D6D3D1" font-size="26" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">AI + Cloud Adversarial Validation Platform</text>
  <text x="82" y="286" fill="#A8A29E" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif">Attack paths · MCP · coding agents · cloud identity · replay · purple-team assurance</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
    <rect x="82" y="324" width="82" height="36" rx="18" fill="#111113" stroke="#44403C"/><text x="123" y="347" text-anchor="middle" fill="#E7E5E4">GO</text>
    <rect x="177" y="324" width="112" height="36" rx="18" fill="#111113" stroke="#44403C"/><text x="233" y="347" text-anchor="middle" fill="#E7E5E4">PYTHON</text>
    <rect x="302" y="324" width="118" height="36" rx="18" fill="#111113" stroke="#44403C"/><text x="361" y="347" text-anchor="middle" fill="#E7E5E4">NEO4J</text>
    <rect x="433" y="324" width="124" height="36" rx="18" fill="#111113" stroke="#44403C"/><text x="495" y="347" text-anchor="middle" fill="#E7E5E4">TEMPORAL</text>
    <rect x="570" y="324" width="85" height="36" rx="18" fill="#111113" stroke="#44403C"/><text x="612.5" y="347" text-anchor="middle" fill="#E7E5E4">OPA</text>
  </g>

  <text x="1318" y="382" text-anchor="end" fill="#78716C" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.4">BRIAN BROOKHART · AI SECURITY RESEARCH</text>
</svg>
