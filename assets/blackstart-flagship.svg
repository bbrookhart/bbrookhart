<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BLACKSTART — consequence-driven cyber-physical resilience</title>
  <desc id="desc">BLACKSTART connects cyber events to control state, physical-process behavior, safety invariants, and mission consequence. In the frozen synthetic experiment, unsafe duration fell from six hundred thirty-nine point five seconds to zero with an independent engineering backstop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.58" stop-color="#081a19"/>
      <stop offset="1" stop-color="#152119"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8ddcf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#203552" stroke-width="2"/>
  <rect x="52" y="34" width="1096" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="73" fill="#5eead4" font-size="14" font-weight="750" letter-spacing="2.4">CYBER-PHYSICAL // OT/ICS // MEASURED EXPERIMENT</text>
    <text x="56" y="113" fill="#f2fbff" font-size="30" font-weight="800">BLACKSTART</text>
    <text x="56" y="141" fill="#91a8bf" font-size="16" letter-spacing="0.5">Assume compromise. Preserve the mission.</text>

    <g filter="url(#shadow)" transform="translate(56 176)">
      <rect width="246" height="105" rx="13" fill="#0d1c30" stroke="#24415f"/>
      <text x="18" y="40" fill="#38bdf8" font-size="27" font-weight="800">639.5s</text>
      <text x="18" y="67" fill="#e5edf6" font-size="15" font-weight="650">unsafe duration</text>
      <text x="18" y="89" fill="#7892ad" font-size="12">unprotected synthetic run</text>
    </g>

    <g filter="url(#shadow)" transform="translate(318 176)">
      <rect width="246" height="105" rx="13" fill="#0d2227" stroke="#246052"/>
      <text x="18" y="40" fill="#2dd4bf" font-size="31" font-weight="800">0.0s</text>
      <text x="18" y="67" fill="#e9fbf6" font-size="15" font-weight="650">unsafe duration</text>
      <text x="18" y="89" fill="#7ea99e" font-size="12">with engineering backstop</text>
    </g>

    <g filter="url(#shadow)" transform="translate(580 176)">
      <rect width="246" height="105" rx="13" fill="#211a10" stroke="#6b4d1d"/>
      <text x="18" y="40" fill="#fbbf24" font-size="27" font-weight="800">SAFETY</text>
      <text x="18" y="67" fill="#fff7e6" font-size="15" font-weight="650">explicit invariants</text>
      <text x="18" y="89" fill="#bca276" font-size="12">independent consequence boundary</text>
    </g>

    <g transform="translate(852 170)">
      <rect width="296" height="117" rx="14" fill="#0b1725" stroke="#2e5369"/>
      <text x="20" y="28" fill="#8fa6bf" font-size="11" font-weight="750" letter-spacing="1.8">RESEARCH QUESTION</text>
      <text x="20" y="55" fill="#e8f8ff" font-size="15" font-weight="750">Can an independent boundary</text>
      <text x="20" y="76" fill="#e8f8ff" font-size="15" font-weight="750">stop cyber failure becoming</text>
      <text x="20" y="97" fill="#e8f8ff" font-size="15" font-weight="750">physical consequence?</text>
    </g>

    <path d="M146 309 H1054" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.68"/>
    <circle cx="146" cy="309" r="4" fill="#38bdf8"/>
    <circle cx="373" cy="309" r="4" fill="#67e8f9"/>
    <circle cx="600" cy="309" r="4" fill="#2dd4bf"/>
    <circle cx="827" cy="309" r="4" fill="#84cc16"/>
    <circle cx="1054" cy="309" r="4" fill="#f59e0b"/>

    <text x="146" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">CYBER EVENT</text>
    <text x="373" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">CONTROL STATE</text>
    <text x="600" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">PHYSICAL PROCESS</text>
    <text x="827" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">SAFETY INVARIANT</text>
    <text x="1054" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">MISSION OUTCOME</text>

    <text x="600" y="370" text-anchor="middle" fill="#d8e7f2" font-size="12" font-weight="700" letter-spacing="1.6">TRACE CONSEQUENCE · ENFORCE SAFETY · PRESERVE MISSION</text>
  </g>
</svg>