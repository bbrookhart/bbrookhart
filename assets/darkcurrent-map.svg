<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">DARKCURRENT research capability map</title>
  <desc id="desc">Projects organized across model and agent assurance, mission resilience, and trust infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="1" stop-color="#0a1223"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8ddcf0" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1400" height="650" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="650" rx="24" fill="url(#dots)"/>
  <text x="70" y="70" fill="#ecf8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" letter-spacing="0.4">ASSURANCE ACROSS THE AUTONOMY STACK</text>
  <text x="70" y="102" fill="#7e93aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.2">MODEL → AGENT → INFRASTRUCTURE → PHYSICAL CONSEQUENCE</text>
  <rect x="70" y="126" width="1260" height="2" rx="1" fill="url(#line)" opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="70" y="168" width="392" height="330" rx="18" fill="#091827" stroke="#1e6175"/>
    <rect x="504" y="168" width="392" height="330" rx="18" fill="#0a1a1b" stroke="#236b59"/>
    <rect x="938" y="168" width="392" height="330" rx="18" fill="#12142a" stroke="#51428d"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="102" y="214" fill="#79e6ff" font-size="14" font-weight="750" letter-spacing="2.1">01 / MODEL &amp; AGENT ASSURANCE</text>
    <text x="102" y="251" fill="#f2fbff" font-size="25" font-weight="750">Constrain intelligence</text>
    <text x="102" y="279" fill="#8ba2b8" font-size="15">Evaluate capability. Bound authority.</text>
    <g transform="translate(102 305)">
      <rect width="328" height="52" rx="10" fill="#0c2233" stroke="#1a5367"/>
      <text x="18" y="23" fill="#dff9ff" font-size="16" font-weight="750">CRUCIBLE</text>
      <text x="18" y="41" fill="#7fb3c3" font-size="12">Frontier AI cyber capability TEVV</text>
      <rect y="68" width="328" height="52" rx="10" fill="#0c2233" stroke="#1a5367"/>
      <text x="18" y="91" fill="#dff9ff" font-size="16" font-weight="750">CERBERUS NULL</text>
      <text x="18" y="109" fill="#7fb3c3" font-size="12">Deterministic authority enforcement</text>
      <rect y="136" width="328" height="52" rx="10" fill="#0c2233" stroke="#1a5367"/>
      <text x="18" y="159" fill="#dff9ff" font-size="16" font-weight="750">VIGIL</text>
      <text x="18" y="177" fill="#7fb3c3" font-size="12">Pre-execution runtime protection</text>
    </g>

    <text x="536" y="214" fill="#79f2cf" font-size="14" font-weight="750" letter-spacing="2.1">02 / MISSION RESILIENCE</text>
    <text x="536" y="251" fill="#f1fff9" font-size="25" font-weight="750">Contain consequence</text>
    <text x="536" y="279" fill="#8eafa4" font-size="15">Preserve safe state under compromise.</text>
    <g transform="translate(536 315)">
      <rect width="328" height="72" rx="10" fill="#0d2925" stroke="#225b4c"/>
      <text x="18" y="28" fill="#e5fff5" font-size="16" font-weight="750">BLACKSTART</text>
      <text x="18" y="48" fill="#86b9aa" font-size="12">Cyber-physical safety invariants</text>
      <text x="18" y="63" fill="#86b9aa" font-size="12">and consequence containment</text>
      <rect y="88" width="328" height="72" rx="10" fill="#0d2925" stroke="#225b4c"/>
      <text x="18" y="116" fill="#e5fff5" font-size="16" font-weight="750">DEADFALL</text>
      <text x="18" y="136" fill="#86b9aa" font-size="12">Strategic pre-positioning detection</text>
      <text x="18" y="151" fill="#86b9aa" font-size="12">across cyber and OT telemetry</text>
    </g>

    <text x="970" y="214" fill="#c4b5fd" font-size="14" font-weight="750" letter-spacing="2.1">03 / TRUST INFRASTRUCTURE</text>
    <text x="970" y="251" fill="#faf8ff" font-size="25" font-weight="750">Prove the system</text>
    <text x="970" y="279" fill="#a49cbc" font-size="15">Verify origin, integrity, and longevity.</text>
    <g transform="translate(970 315)">
      <rect width="328" height="72" rx="10" fill="#191831" stroke="#4a4079"/>
      <text x="18" y="28" fill="#f3efff" font-size="16" font-weight="750">IRONVEIL</text>
      <text x="18" y="48" fill="#afa6d2" font-size="12">Software and firmware provenance</text>
      <text x="18" y="63" fill="#afa6d2" font-size="12">from source to installed state</text>
      <rect y="88" width="328" height="72" rx="10" fill="#191831" stroke="#4a4079"/>
      <text x="18" y="116" fill="#f3efff" font-size="16" font-weight="750">HARVEST//ZERO</text>
      <text x="18" y="136" fill="#afa6d2" font-size="12">Post-quantum migration and</text>
      <text x="18" y="151" fill="#afa6d2" font-size="12">cryptographic dependency assurance</text>
    </g>
  </g>

  <path d="M266 517 V548 H700 M700 548 H1134 M700 548 V570" fill="none" stroke="url(#line)" stroke-width="2" stroke-opacity="0.72"/>
  <circle cx="266" cy="517" r="4" fill="#22d3ee"/>
  <circle cx="700" cy="517" r="4" fill="#5eead4"/>
  <circle cx="1134" cy="517" r="4" fill="#8b5cf6"/>
  <rect x="396" y="570" width="608" height="48" rx="24" fill="#0b1725" stroke="url(#line)"/>
  <text x="700" y="600" text-anchor="middle" fill="#e7f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">BOUNDED · OBSERVABLE · REPRODUCIBLE · DEFENSIBLE</text>
</svg>
