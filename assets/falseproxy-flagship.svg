<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Falseproxy — identity, scope, and revocation under MCP/A2A delegation</title>
  <desc id="desc">Falseproxy tests whether identity, provenance, scope, audience, and revocation survive delegation across MCP and A2A hops. The technical-preview suite covers 96 declarative scenarios across 18 attack classes, each paired with a matched benign control, run through a reproducible preview pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.58" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#1f1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8ddcf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#203552" stroke-width="2"/>
  <rect x="52" y="34" width="1096" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="73" fill="#fda4af" font-size="14" font-weight="750" letter-spacing="2.4">TECHNICAL PREVIEW // MCP/A2A DELEGATION SECURITY</text>
    <text x="56" y="113" fill="#f2fbff" font-size="30" font-weight="800">FALSEPROXY</text>
    <text x="56" y="141" fill="#91a8bf" font-size="16" letter-spacing="0.5">Trace the delegation. Test the boundary. Prove revocation holds.</text>

    <g filter="url(#shadow)" transform="translate(56 176)">
      <rect width="246" height="105" rx="13" fill="#0d1c30" stroke="#24415f"/>
      <text x="18" y="40" fill="#38bdf8" font-size="31" font-weight="800">96</text>
      <text x="18" y="67" fill="#e5edf6" font-size="15" font-weight="650">declarative scenarios</text>
      <text x="18" y="89" fill="#7892ad" font-size="12">MCP/A2A delegation suite</text>
    </g>

    <g filter="url(#shadow)" transform="translate(318 176)">
      <rect width="246" height="105" rx="13" fill="#24121c" stroke="#6b2d3f"/>
      <text x="18" y="40" fill="#fb7185" font-size="31" font-weight="800">18</text>
      <text x="18" y="67" fill="#fde8ec" font-size="15" font-weight="650">attack classes</text>
      <text x="18" y="89" fill="#c497a3" font-size="12">identity · scope · audience · revoke</text>
    </g>

    <g filter="url(#shadow)" transform="translate(580 176)">
      <rect width="246" height="105" rx="13" fill="#17182e" stroke="#51428d"/>
      <text x="18" y="40" fill="#a78bfa" font-size="31" font-weight="800">1:1</text>
      <text x="18" y="67" fill="#f2efff" font-size="15" font-weight="650">matched benign controls</text>
      <text x="18" y="89" fill="#aaa1ca" font-size="12">reproducible preview pipeline</text>
    </g>

    <g transform="translate(852 170)">
      <rect width="296" height="117" rx="14" fill="#0b1725" stroke="#2e5369"/>
      <text x="20" y="28" fill="#8fa6bf" font-size="11" font-weight="750" letter-spacing="1.8">RESEARCH QUESTION</text>
      <text x="20" y="55" fill="#e8f8ff" font-size="15" font-weight="750">Can scope and revocation</text>
      <text x="20" y="76" fill="#e8f8ff" font-size="15" font-weight="750">survive delegation across</text>
      <text x="20" y="97" fill="#e8f8ff" font-size="15" font-weight="750">MCP and A2A hops?</text>
    </g>

    <path d="M146 309 H1054" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.68"/>
    <circle cx="146" cy="309" r="4" fill="#38bdf8"/>
    <circle cx="373" cy="309" r="4" fill="#67e8f9"/>
    <circle cx="600" cy="309" r="4" fill="#fb7185"/>
    <circle cx="827" cy="309" r="4" fill="#c084fc"/>
    <circle cx="1054" cy="309" r="4" fill="#a78bfa"/>

    <text x="146" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">IDENTITY</text>
    <text x="373" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">PROVENANCE</text>
    <text x="600" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">SCOPE</text>
    <text x="827" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">AUDIENCE</text>
    <text x="1054" y="337" text-anchor="middle" fill="#99afc3" font-size="12" font-weight="700">REVOCATION</text>

    <text x="600" y="370" text-anchor="middle" fill="#d8e7f2" font-size="12" font-weight="700" letter-spacing="1.6">SCOPE THE GRANT · TRACE THE HOP · VERIFY REVOCATION</text>
  </g>
</svg>
