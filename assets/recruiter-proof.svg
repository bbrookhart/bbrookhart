<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Measured research evidence</title>
  <desc id="desc">CERBERUS NULL: zero of 24 unsafe actions escaped. VIGIL: 413 passing tests. BLACKSTART: unsafe duration reduced from 639.5 seconds to zero. Meridian Atlas: 45 attack and 65 benign replays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="248" rx="17" fill="none" stroke="#203552" stroke-width="2"/>
  <rect x="52" y="34" width="1096" height="3" rx="1.5" fill="url(#line)" filter="url(#glow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="58" y="71" fill="#8fa6bf" font-size="15" font-weight="700" letter-spacing="2.5">RECRUITER PROOF // MEASURED PUBLIC EVIDENCE</text>

    <g transform="translate(52 91)">
      <rect width="252" height="120" rx="12" fill="#0d1c30" stroke="#24415f"/>
      <text x="20" y="48" fill="#38bdf8" font-size="34" font-weight="800">0 / 24</text>
      <text x="20" y="76" fill="#e5edf6" font-size="16" font-weight="650">unsafe actions escaped</text>
      <text x="20" y="101" fill="#7892ad" font-size="13">CERBERUS NULL v0.1</text>
    </g>

    <g transform="translate(332 91)">
      <rect width="252" height="120" rx="12" fill="#0d1c30" stroke="#24415f"/>
      <text x="20" y="48" fill="#2dd4bf" font-size="34" font-weight="800">413</text>
      <text x="20" y="76" fill="#e5edf6" font-size="16" font-weight="650">passing tests</text>
      <text x="20" y="101" fill="#7892ad" font-size="13">VIGIL runtime core</text>
    </g>

    <g transform="translate(612 91)">
      <rect width="252" height="120" rx="12" fill="#0d1c30" stroke="#24415f"/>
      <text x="20" y="48" fill="#a78bfa" font-size="30" font-weight="800">639.5s → 0.0s</text>
      <text x="20" y="76" fill="#e5edf6" font-size="16" font-weight="650">unsafe duration</text>
      <text x="20" y="101" fill="#7892ad" font-size="13">BLACKSTART EXP-BS-001</text>
    </g>

    <g transform="translate(892 91)">
      <rect width="256" height="120" rx="12" fill="#0d1c30" stroke="#24415f"/>
      <text x="20" y="48" fill="#f8c55c" font-size="34" font-weight="800">45 + 65</text>
      <text x="20" y="76" fill="#e5edf6" font-size="16" font-weight="650">attack / benign replays</text>
      <text x="20" y="101" fill="#7892ad" font-size="13">Meridian Atlas</text>
    </g>
  </g>
</svg>
