<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">DARKCURRENT AI security research program</title>
  <desc id="desc">Security assurance for autonomous AI, scientific systems, and critical infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040812"/>
      <stop offset="0.55" stop-color="#081426"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21d4fd"/>
      <stop offset="0.58" stop-color="#48f2c2"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#21d4fd" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#21d4fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#7dd3fc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="1110" cy="205" r="310" fill="url(#glow)"/>
  <path d="M0 347 C220 306 388 381 604 327 S1013 278 1400 329" fill="none" stroke="url(#signal)" stroke-opacity="0.32" stroke-width="2"/>
  <path d="M0 366 C251 327 391 400 644 352 S1045 310 1400 353" fill="none" stroke="#8b5cf6" stroke-opacity="0.14" stroke-width="1"/>

  <g transform="translate(74 63)">
    <rect x="0" y="0" width="6" height="284" rx="3" fill="url(#signal)"/>
    <text x="30" y="24" fill="#70e4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">DARKCURRENT // RESEARCH PROGRAM</text>
    <text x="28" y="106" fill="#f8fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-1.4">SECURING AUTONOMY</text>
    <text x="30" y="151" fill="#9fb4cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">AI security for scientific, cyber-physical, and</text>
    <text x="30" y="184" fill="#9fb4cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">national-security systems where failure has consequence.</text>
    <g transform="translate(30 226)">
      <rect width="191" height="38" rx="19" fill="#0d2637" stroke="#1f9fbe" stroke-opacity="0.7"/>
      <text x="95.5" y="25" text-anchor="middle" fill="#8be9fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">RUNTIME ASSURANCE</text>
      <rect x="205" width="204" height="38" rx="19" fill="#10251f" stroke="#2bbf92" stroke-opacity="0.65"/>
      <text x="307" y="25" text-anchor="middle" fill="#86efcf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ADVERSARIAL TEVV</text>
      <rect x="423" width="225" height="38" rx="19" fill="#18172f" stroke="#7c5ce0" stroke-opacity="0.7"/>
      <text x="535.5" y="25" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MISSION RESILIENCE</text>
    </g>
  </g>

  <g transform="translate(1005 71)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="172" cy="139" r="116" stroke="#5fdcf7" stroke-opacity="0.22"/>
    <circle cx="172" cy="139" r="86" stroke="#5fdcf7" stroke-opacity="0.2" stroke-dasharray="3 9"/>
    <path d="M172 53 L246 96 L246 181 L172 224 L98 181 L98 96 Z" stroke="url(#signal)" stroke-width="2.5" stroke-opacity="0.8"/>
    <path d="M172 53 V139 M98 96 L172 139 L246 96 M98 181 L172 139 L246 181 M172 139 V224" stroke="#67e8f9" stroke-opacity="0.42"/>
    <circle cx="172" cy="139" r="17" fill="#091825" stroke="#78f1dc" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="172" cy="53" r="7" fill="#21d4fd"/>
    <circle cx="246" cy="96" r="7" fill="#48f2c2"/>
    <circle cx="246" cy="181" r="7" fill="#8b5cf6"/>
    <circle cx="172" cy="224" r="7" fill="#48f2c2"/>
    <circle cx="98" cy="181" r="7" fill="#21d4fd"/>
    <circle cx="98" cy="96" r="7" fill="#8b5cf6"/>
    <path d="M56 139 H12 M288 139 H332 M172 11 V-24 M172 267 V302" stroke="#7dd3fc" stroke-opacity="0.3"/>
    <circle cx="12" cy="139" r="4" fill="#21d4fd"/>
    <circle cx="332" cy="139" r="4" fill="#8b5cf6"/>
  </g>

  <text x="1326" y="386" text-anchor="end" fill="#6f8197" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="2">BRIAN BROOKHART · AI SECURITY RESEARCH</text>
</svg>
